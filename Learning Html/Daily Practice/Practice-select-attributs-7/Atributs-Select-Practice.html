<!DOCTYPE html>
<html lang="en">
<head>
    
    <title>Practicing Select and Atrributs</title>
</head>
<body>
    <fieldset>
        <legend>Muslim English Academy(Website)</legend>
        <fieldset>
            <legend>Log In Page</legend>
            <label>ID</label> 
            <input type="number" placeholder="Enter Your ID" maxlength="4"/>&nbsp;&nbsp;
            <label>Login Password</label>
            <input type="password" placeholder="Enter the Password" value="34955" disabled size="10"/>&nbsp;&nbsp;
            <label>Name</label>
            <input type="text" style="background-color: aquamarine;" value="Ahmad"/>&nbsp;&nbsp;
            
            <br/>
            <br/>
            <label>Father Name</label>
            <input type="tex" maxlength="20" />&nbsp;&nbsp;
            <label>Prefered Time</label>
            <input type="time"/>&nbsp;&nbsp;
            <label>Date</label>
            <input type="date"/>&nbsp;&nbsp;<br/>
        </fieldset>
            <fieldset>
                <legend>Info About The Classes</legend>
                 <label>Books</label><br/>
            <select>
                <option selected>File1</option>
                <option>File Two</option>
                <option>File Three</option>
                <option>File Foure</option>
                <option>File Five</option>
                <option disabled>File Six</option>
            </select>
                    &nbsp;&nbsp;&nbsp;

            <label>Time</label>
            <select>
                <option Selected>Am</option>
                <option>Pm</option>
                <option disabled>Night Time</option>
            </select>
                    &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
            <label>Skill Want to Improve</label>
            <select multiple>
                <option selected>Speaking</option>
                <option>Listening</option>
                <option>Writing</option>
                <option>Reading</option>
                <option disabled>Grammar</option>
                <option disabled>Vocabulary</option>
            </select>
            <br/><br/>
            <label>Write More Discription about what You want to Study</label>
            <textarea></textarea>

            </fieldset>
    </fieldset>
</body>
</html>
